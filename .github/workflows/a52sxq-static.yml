name: A52s Static Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - seventeen-s26u
  push:
    branches:
      - seventeen-s26u

permissions:
  contents: read

concurrency:
  group: a52sxq-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate A52s source configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            buildenv.sh
            scripts/
            platform/sm7325/
            target/a52sxq/
            unica/
          sparse-checkout-cone-mode: true

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find buildenv.sh scripts platform/sm7325 target/a52sxq unica -type f -name '*.sh' -print0)
          echo "Bash syntax validation passed."

      - name: Run ShellCheck on A52s build scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            shellcheck -e SC1090,SC1091 -s bash "$file"
          done < <(find platform scripts target unica -type f -name '*.sh' \
            -not -name '*ssi.sh' -not -name 'config.sh' -not -name 'sff.sh' | sort)
          echo "ShellCheck validation passed."

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import py_compile
          files = sorted(pathlib.Path(".").glob("target/a52sxq/**/*.py"))
          for path in files:
              py_compile.compile(str(path), doraise=True, cfile="/tmp/" + path.name + ".pyc")
          print(f"Validated {len(files)} A52s Python files.")
          PY

      - name: Check A52s donor and platform invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'TARGET_PLATFORM="sm7325"' target/a52sxq/config.sh
          grep -Fq 'TARGET_OS_SINGLE_SYSTEM_IMAGE="qssi"' platform/sm7325/config.sh
          grep -Fq 'TARGET_WLAN_SUPPORT_80211AX_6GHZ=false' platform/sm7325/config.sh
          grep -Fq 'TARGET_WLAN_SUPPORT_MOBILEAP_6G=false' platform/sm7325/config.sh
          grep -Fq 'TARGET_COMMON_SUPPORT_EMBEDDED_SIM=false' target/a52sxq/config.sh
          grep -Fq 'TARGET_FINGERPRINT_CONFIG_SENSOR="google_touch_display_optical,settings=3"' target/a52sxq/config.sh
          grep -Fq 'TARGET_RIL_FEATURES="onebinary"' target/a52sxq/config.sh
          grep -Fq 'TARGET_SUPER_PARTITION_SIZE=10643046400' target/a52sxq/config.sh
          grep -Fq 'TARGET_QTI_DYNAMIC_PARTITIONS_SIZE=10638852096' target/a52sxq/config.sh
          grep -Fq 'SOURCE_FIRMWARE="SM-S948B/EUX/' unica/configs/qssi.sh
          grep -Fq 'SOURCE_PLATFORM_SDK_VERSION=36' unica/configs/qssi.sh
          grep -Fq 'TARGET_CODENAME' scripts/internal/gen_config_file.sh
          echo "A52s donor/platform invariants passed."
