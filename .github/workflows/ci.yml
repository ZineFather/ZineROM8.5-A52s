name: ZineUI quality checks

on:
  pull_request:
  push:
    branches:
      - 'sixteen'
      - 'manus/zinerom85-phase2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks (no ROM build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: ShellCheck build and firmware scripts
        run: |
          shellcheck -e SC1090,SC1091 -s bash \
            buildenv.sh \
            scripts/download_fw.sh \
            scripts/extract_fw.sh \
            scripts/build_flashable_zip.sh \
            scripts/make_rom.sh \
            scripts/internal/gen_config_file.sh \
            scripts/tests/firmware_version_test.sh \
            scripts/utils/firmware_utils.sh \
            scripts/utils/firmware_version.sh \
            scripts/utils/install_utils.sh \
            target/a52sxq/patches/build_id/customize.sh \
            target/a52sxq/patches/hwui_vulkan_default/customize.sh \
            unica/patches/saiv/customize.sh \
            unica/patches/stock_blobs/customize.sh

      - name: Bash syntax checks
        run: |
          bash -n buildenv.sh \
            scripts/download_fw.sh \
            scripts/extract_fw.sh \
            scripts/build_flashable_zip.sh \
            scripts/make_rom.sh \
            scripts/internal/gen_config_file.sh \
            scripts/tests/firmware_version_test.sh \
            scripts/utils/firmware_utils.sh \
            scripts/utils/firmware_version.sh \
            scripts/utils/install_utils.sh \
            target/a52sxq/patches/adreno_driver/customize.sh \
            target/a52sxq/patches/build_id/customize.sh \
            target/a52sxq/patches/hwui_vulkan_default/customize.sh \
            unica/mods/settings/customize.sh

      - name: Firmware tuple regression tests
        run: bash scripts/tests/firmware_version_test.sh

      - name: Settings resource and default-target checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          root = Path('.')
          xml_files = [
              root / 'unica/mods/settings/SecSettings.apk/res/layout/unica_settings_logo_layout.xml',
              root / 'unica/mods/settings/SecSettings.apk/res/values/strings.xml',
              root / 'unica/mods/settings/SecSettings.apk/res/values-ar/strings.xml',
          ]
          for path in xml_files:
              ET.parse(path)
          for path in xml_files[1:]:
              text = path.read_text(encoding='utf-8')
              assert 'name="zineui_logo_title"' in text
              assert 'UN1CA' not in text
          PY
          bash -c 'source ./buildenv.sh; [[ "$TARGET_CODENAME" == "a52sxq" ]]; [[ "$ROM_VERSION" == 8.5.0-* ]]; printf "Default target: %s (%s)\nROM version: %s\n" "$TARGET_CODENAME" "$TARGET_NAME" "$ROM_VERSION"'
